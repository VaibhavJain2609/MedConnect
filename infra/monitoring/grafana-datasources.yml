# Grafana provisioning — auto-registers the local Loki datasource so
# Explore works out of the box (docker-compose.yml `observability`
# profile, Grafana on http://localhost:3001).
apiVersion: 1

datasources:
  - name: Loki
    type: loki
    access: proxy
    url: http://loki:3100
    isDefault: true
    editable: true
