apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: medconnect-staging

resources:
- ../../base

# behavior: replace overrides the base's same-named generated ConfigMap
# outright — this is what actually closes the hardcoded-localhost:3000 gap
# per environment (see base/keycloak/deployment.yaml's comment).
configMapGenerator:
- behavior: replace
  files:
  - keycloak/realm-export.json
  name: keycloak-realm-config
  options:
    disableNameSuffixHash: true

# The CD pipeline runs `kustomize edit set image
# medconnect-backend=<ecr>/...:<sha> medconnect-frontend=... medconnect-keycloak=...`
# against this file immediately before `kubectl apply -k` — no images: block
# is pre-declared here since it has nothing meaningful to default to.

      # Internal cluster DNS for the keycloak Service — namespace-qualified to
      # this overlay's namespace. Deliberately NOT the bare `http://keycloak:8080`
      # literal, which Settings.check_production_config() rejects under
      # APP_ENV=production (backend/app/config.py).
      # Public origins: frontend served at / and backend under /api on the
      # same host, so both are the app hostname. FRONTEND_URL must not contain
      # "localhost" under APP_ENV=production.


  # ExternalSecrets: bind to the shared cluster-admin-applied ClusterSecretStore
  # (infra/k8s/bootstrap/cluster-secret-store.yaml) and point dataFrom at this
  # environment's Secrets Manager paths — Terraform's secrets module writes
  # JSON to medconnect/<environment>/<suffix>.

patches:
- patch: |-
    - op: replace
      path: /data/KEYCLOAK_PUBLIC_URL
      value: https://auth.medconnect.jainvaibhav.me
    - op: replace
      path: /data/KC_HOSTNAME
      value: auth.medconnect.jainvaibhav.me
    - op: replace
      path: /data/NEXT_PUBLIC_API_URL
      value: https://medconnect.jainvaibhav.me/api
    # Internal cluster DNS for the keycloak Service — namespace-qualified to
    # this overlay's namespace. Deliberately NOT the bare `http://keycloak:8080`
    # literal, which Settings.check_production_config() rejects under
    # APP_ENV=production (backend/app/config.py).
    - op: replace
      path: /data/KEYCLOAK_URL
      value: http://keycloak.medconnect-staging.svc.cluster.local:8080
    # Public origins: frontend served at / and backend under /api on the
    # same host, so both are the app hostname. FRONTEND_URL must not contain
    # "localhost" under APP_ENV=production.
    - op: replace
      path: /data/FRONTEND_URL
      value: https://medconnect.jainvaibhav.me
    - op: replace
      path: /data/BACKEND_URL
      value: https://medconnect.jainvaibhav.me
  target:
    kind: ConfigMap
    name: medconnect-config
- patch: |-
    - op: replace
      path: /metadata/annotations/alb.ingress.kubernetes.io~1certificate-arn
      value: arn:aws:acm:ap-south-1:214920155636:certificate/0b72c538-1c11-499b-9414-b75cd91cd769
    - op: replace
      path: /metadata/annotations/alb.ingress.kubernetes.io~1wafv2-acl-arn
      value: arn:aws:wafv2:ap-south-1:214920155636:regional/webacl/medconnect-staging/1ef7478a-ca9c-4f6d-a371-8bf9567d6843
    - op: replace
      path: /spec/rules/0/host
      value: auth.medconnect.jainvaibhav.me
    - op: replace
      path: /spec/rules/1/host
      value: medconnect.jainvaibhav.me
  target:
    kind: Ingress
    name: medconnect
- patch: |-
    - op: replace
      path: /spec/secretStoreRef/name
      value: medconnect-secrets-store
    - op: replace
      path: /spec/dataFrom/0/extract/key
      value: medconnect/staging/rds
    - op: replace
      path: /spec/dataFrom/1/extract/key
      value: medconnect/staging/redis
    - op: replace
      path: /spec/dataFrom/2/extract/key
      value: medconnect/staging/keycloak-admin
  target:
    kind: ExternalSecret
    name: backend-secrets
- patch: |-
    - op: replace
      path: /spec/secretStoreRef/name
      value: medconnect-secrets-store
    - op: replace
      path: /spec/dataFrom/0/extract/key
      value: medconnect/staging/keycloak-admin
    - op: replace
      path: /spec/dataFrom/1/extract/key
      value: medconnect/staging/rds
  target:
    kind: ExternalSecret
    name: keycloak-secrets
images:
- name: medconnect-backend
  newName: 214920155636.dkr.ecr.ap-south-1.amazonaws.com/medconnect-backend
  newTag: fd342e8
- name: medconnect-frontend
  newName: 214920155636.dkr.ecr.ap-south-1.amazonaws.com/medconnect-frontend
  newTag: fd342e8
- name: medconnect-keycloak
  newName: 214920155636.dkr.ecr.ap-south-1.amazonaws.com/medconnect-keycloak
  newTag: fd342e8
