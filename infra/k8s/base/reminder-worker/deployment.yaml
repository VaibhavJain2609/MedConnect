# ARQ reminder worker — enqueues/sends the 24h and 2h appointment reminders
# scheduled via app.workers.scheduler (backend/app/workers/reminder_worker.py).
# Runs the same backend image with the arq entrypoint instead of uvicorn.
# No Service: nothing routes into it; it only pulls jobs from Redis and
# writes to Postgres. No HPA/PDB: a single replica is correct — arq cron
# functions fire per worker, and duplicate workers would double-send
# reminders unless the app-level scheduling gets distributed locking.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: reminder-worker
  labels:
    app: reminder-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: reminder-worker
  template:
    metadata:
      labels:
        app: reminder-worker
    spec:
      serviceAccountName: backend-sa
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      # tmp emptyDir backs /tmp for the readOnlyRootFilesystem container —
      # Python's tempfile and assorted libs need *somewhere* writable.
      volumes:
        - name: tmp
          emptyDir: {}
      containers:
        - name: reminder-worker
          image: medconnect-backend:latest
          imagePullPolicy: IfNotPresent
          workingDir: /app
          command:
            - arq
            - app.workers.reminder_worker.WorkerSettings
          envFrom:
            - configMapRef:
                name: medconnect-config
            - secretRef:
                name: backend-secrets
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
