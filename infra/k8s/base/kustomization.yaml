apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: medconnect

# Namespace + ClusterSecretStore are deliberately NOT here: both are
# cluster-scoped, and the CD pipeline's IAM role (AmazonEKSEditPolicy, scoped
# to medconnect-staging/medconnect-prod) cannot apply cluster-scoped kinds.
# They live in infra/k8s/bootstrap/ and are applied once by a cluster-admin —
# see infra/README.md for the bootstrap order.

resources:
  - configmap.yaml
  - backend/serviceaccount.yaml
  - backend/deployment.yaml
  - backend/service.yaml
  - backend/hpa.yaml
  - backend/pdb.yaml
  - backend/servicemonitor.yaml
  - frontend/deployment.yaml
  - frontend/service.yaml
  - frontend/hpa.yaml
  - frontend/pdb.yaml
  - keycloak/deployment.yaml
  - keycloak/service.yaml
  - reminder-worker/deployment.yaml
  # db-bootstrap must run before alembic: it creates the `medconnect_medicines`
  # database, the `keycloak` schema, and the pg_trgm/vector extensions that
  # the migrations assume exist.
  - migrations/db-bootstrap-job.yaml
  - migrations/job.yaml
  - ingress/ingress.yaml
  - external-secrets/backend-external-secret.yaml
  - external-secrets/keycloak-external-secret.yaml
  # Optional hardening — uncomment to enforce per-namespace resource budgets.
  # Safe to enable: every workload in this base sets explicit requests/limits.
  # - resourcequota.yaml

# disableNameSuffixHash so the name stays exactly "keycloak-realm-config" —
# keycloak/deployment.yaml's volumes.configMap.name references it literally,
# and each overlay's own configMapGenerator (same name, behavior: replace)
# swaps in its environment's real hostname without needing a kustomize var.
configMapGenerator:
  - name: keycloak-realm-config
    files:
      - keycloak/realm-export.json
    options:
      disableNameSuffixHash: true

# No images: transformer here — base intentionally leaves the deployment
# manifests' `image:` fields as the literal `medconnect-backend:latest` /
# `medconnect-frontend:latest` / `medconnect-keycloak:latest` refs (the
# kustomize convention for a placeholder image). Each overlay's own
# `images:` block, or the CD pipeline's `kustomize edit set image`, rewrites
# these to the real ECR registry + tag at deploy time.
