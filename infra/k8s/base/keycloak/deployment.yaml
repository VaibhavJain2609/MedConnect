# Single replica only: Keycloak session clustering across pods requires
# KC_CACHE_STACK=kubernetes plus a JGroups/Infinispan discovery setup (a
# headless Service + KUBE_PING config, typically also RBAC for the pod to
# list its own namespace's pods). That is a documented follow-up, not
# implemented here — do not raise replicas above 1 without it, or sessions
# will not be shared and users will get bounced between inconsistent state.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
  labels:
    app: keycloak
spec:
  replicas: 1
  selector:
    matchLabels:
      app: keycloak
  template:
    metadata:
      labels:
        app: keycloak
    spec:
      securityContext:
        runAsNonRoot: true
      # `keycloak-realm-config` is generated by kustomize's configMapGenerator
      # (see kustomization.yaml) from this base's keycloak/realm-export.json;
      # each overlay replaces it (behavior: replace) with its own copy that
      # has PLACEHOLDER_FRONTEND_ORIGIN filled in with the real environment
      # hostname, closing the hardcoded-localhost:3000 gap the original
      # docker-compose realm-export.json had.
      volumes:
        - name: realm-config
          configMap:
            name: keycloak-realm-config
      containers:
        - name: keycloak
          image: medconnect-keycloak:latest
          args:
            - start
            - --optimized
            # Only imports on first boot / when the realm doesn't already
            # exist — safe to leave on permanently, it does not clobber
            # realm state (roles, users, sessions) on every pod restart.
            - --import-realm
          ports:
            - name: http
              containerPort: 8080
            - name: health
              containerPort: 9000
          env:
            - name: KC_DB
              value: postgres
            # Schema `keycloak` inside the shared `medconnect` RDS database —
            # matches docker-compose's KC_DB_SCHEMA convention.
            - name: KC_DB_SCHEMA
              value: keycloak
          envFrom:
            - configMapRef:
                name: medconnect-config
            - secretRef:
                name: keycloak-secrets
          volumeMounts:
            - name: realm-config
              mountPath: /opt/keycloak/data/import
              readOnly: true
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
          resources:
            requests:
              cpu: 250m
              memory: 768Mi
            limits:
              cpu: 500m
              memory: 1Gi
          # Keycloak's first boot (JVM + Quarkus + realm import + initial DB
          # schema creation against RDS) routinely exceeds the ~80s the
          # liveness probe's initialDelay allows, which crash-loops a cold
          # start. The startupProbe gates liveness until /health/started
          # reports up — 30 × 10s gives a 5-minute budget.
          startupProbe:
            httpGet:
              path: /health/started
              port: health
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /health/ready
              port: health
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health/live
              port: health
            initialDelaySeconds: 60
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 6
