# Assumes the AWS Secrets Manager JSON keys already match the app's env var
# names (backend/app/config.py's Settings class): `.../rds` holds
# DATABASE_URL, DATABASE_URL_SYNC, MEDICINE_DB_URL, MEDICINE_DB_URL_SYNC,
# SENTRY_DSN; `.../redis` holds REDIS_URL; `.../keycloak-admin` holds
# KEYCLOAK_ADMIN_USER, KEYCLOAK_ADMIN_PASSWORD (the backend calls Keycloak's
# admin REST API as this user — see Settings.KEYCLOAK_ADMIN_USER). If the
# Terraform-created secret uses different key names, add an explicit
# `data:` (secretKey/remoteRef.property) mapping instead of `dataFrom.extract`.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: backend-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    # Cluster-scoped store; each overlay renames it (see cluster-secret-store.yaml)
    # and must patch this reference to match.
    name: PLACEHOLDER_SECRET_STORE_NAME
    kind: ClusterSecretStore
  target:
    name: backend-secrets
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: medconnect/ENVIRONMENT_PLACEHOLDER/rds
    - extract:
        key: medconnect/ENVIRONMENT_PLACEHOLDER/redis
    - extract:
        key: medconnect/ENVIRONMENT_PLACEHOLDER/keycloak-admin
