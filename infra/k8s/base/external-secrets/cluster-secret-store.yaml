# serviceAccountRef points at an IRSA-annotated ServiceAccount that grants
# read access to the relevant AWS Secrets Manager paths. Another engineer's
# Terraform creates the actual IAM role + trust policy for
# `external-secrets-irsa` — this only references it by name.
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: medconnect-secrets-store
spec:
  provider:
    aws:
      service: SecretsManager
      region: PLACEHOLDER_AWS_REGION
      auth:
        jwt:
          serviceAccountRef:
            name: external-secrets-irsa
            # ClusterSecretStore is cluster-scoped, so kustomize's `namespace:`
            # transformer does NOT rewrite this cross-reference — each overlay
            # patches it explicitly to match its own namespace.
            namespace: PLACEHOLDER_NAMESPACE
