# Same key-layout assumption as backend-external-secret.yaml: `.../keycloak-admin`
# holds KEYCLOAK_ADMIN, KEYCLOAK_ADMIN_PASSWORD; `.../rds` holds KC_DB_URL,
# KC_DB_USERNAME, KC_DB_PASSWORD.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: keycloak-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: PLACEHOLDER_SECRET_STORE_NAME
    kind: ClusterSecretStore
  target:
    name: keycloak-secrets
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: medconnect/ENVIRONMENT_PLACEHOLDER/keycloak-admin
    - extract:
        key: medconnect/ENVIRONMENT_PLACEHOLDER/rds
