apiVersion: v1
kind: ServiceAccount
metadata:
  name: backend-sa
  annotations:
    # IRSA role ARN, created by Terraform (infra/terraform) — only needed if/when
    # the backend talks to AWS services directly (e.g. S3 for uploads). Leave
    # unset until that IAM role exists; an empty annotation is harmless but an
    # annotation pointing at a role that doesn't exist yet will break pod
    # scheduling under some CNI/webhook configs, so it is commented out instead.
    # eks.amazonaws.com/role-arn: "PLACEHOLDER_BACKEND_IRSA_ROLE_ARN"
