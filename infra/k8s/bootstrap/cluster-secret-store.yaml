# ClusterSecretStore is cluster-scoped — the CD role (AmazonEKSEditPolicy,
# namespace-scoped) cannot apply it, so it lives in this bootstrap set,
# applied once by a cluster-admin. Both environment overlays' ExternalSecrets
# reference it by name (medconnect-secrets-store).
#
# apiVersion is external-secrets.io/v1 (stable since ESO 1.0): the addons
# module pins the external-secrets Helm chart to the 2.x line, whose CRDs no
# longer serve the deprecated v1beta1 API.
#
# auth.jwt.serviceAccountRef points at the external-secrets controller's own
# ServiceAccount — the one the Helm chart creates in the `external-secrets`
# namespace with the eks.amazonaws.com/role-arn annotation. The IRSA trust
# policy in infra/terraform/modules/addons/irsa.tf is StringEquals-scoped to
# exactly `system:serviceaccount:external-secrets:external-secrets`, so a
# differently-named or differently-placed SA would fail sts:AssumeRoleWithWebIdentity.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: medconnect-secrets-store
spec:
  provider:
    aws:
      service: SecretsManager
      # Must match the AWS region the Terraform secrets module writes to
      # (environments/*/variables.tf's `region`, default ap-south-1). The IRSA
      # policy itself is region-parameterized; this literal has to agree with it.
      region: ap-south-1
      auth:
        jwt:
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets
