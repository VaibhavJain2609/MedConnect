name: Deploy environment

on:
  workflow_call:
    inputs:
      environment:
        description: "GitHub Environment name (staging/production) — gates the job on that Environment's required reviewers, if configured"
        required: true
        type: string
      namespace:
        required: true
        type: string
      overlay_path:
        required: true
        type: string
      app_hostname:
        description: "Public hostname to smoke-test after rollout, e.g. staging.medconnect.example.com"
        required: true
        type: string
      backend_image:
        required: true
        type: string
      frontend_image:
        required: true
        type: string
      keycloak_image:
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4 # pin: resolve tag to full commit SHA

      - uses: aws-actions/configure-aws-credentials@v4 # pin: resolve tag to full commit SHA
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Update kubeconfig
        run: aws eks update-kubeconfig --name ${{ vars.EKS_CLUSTER_NAME }} --region ${{ vars.AWS_REGION }}

      - name: Install kustomize
        # kubectl bundles a kustomize *renderer* (`kubectl kustomize`), but not
        # the `edit` subcommand this job needs to set image tags.
        run: |
          curl -sSL "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize/v5.5.0/kustomize_v5.5.0_linux_amd64.tar.gz" | tar xz
          sudo mv kustomize /usr/local/bin/

      - name: Install yq
        run: |
          sudo curl -sSL -o /usr/local/bin/yq https://github.com/mikefarah/yq/releases/download/v4.44.3/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

      - name: Set image tags
        working-directory: ${{ inputs.overlay_path }}
        run: |
          kustomize edit set image \
            medconnect-backend=${{ inputs.backend_image }} \
            medconnect-frontend=${{ inputs.frontend_image }} \
            medconnect-keycloak=${{ inputs.keycloak_image }}

      - name: Render manifests
        run: kubectl kustomize ${{ inputs.overlay_path }} > /tmp/rendered.yaml

      # The overlays deliberately ship PLACEHOLDER_* tokens (ACM/WAF ARNs
      # can't be committed; the ExternalSecret names/region/namespace aren't
      # resolvable by kustomize). Substitute them from GitHub variables here,
      # at deploy time — the ACM_CERT_ARN_* / WAF_ACL_ARN_* repository
      # variables must exist per environment or this step fails fast rather
      # than applying an Ingress with literal "PLACEHOLDER_" annotations.
      - name: Substitute environment placeholders
        env:
          ACM_CERT_ARN: ${{ vars[format('ACM_CERT_ARN_{0}', inputs.environment == 'production' && 'PROD' || 'STAGING')] }}
          WAF_ACL_ARN: ${{ vars[format('WAF_ACL_ARN_{0}', inputs.environment == 'production' && 'PROD' || 'STAGING')] }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          NAMESPACE: ${{ inputs.namespace }}
          # Secrets Manager key prefix used in the ExternalSecrets'
          # `medconnect/<env>/...` paths.
          ENV_SLUG: ${{ inputs.environment == 'production' && 'prod' || 'staging' }}
        run: |
          : "${ACM_CERT_ARN:?ACM_CERT_ARN_STAGING/ACM_CERT_ARN_PROD repository variable is not set}"
          : "${WAF_ACL_ARN:?WAF_ACL_ARN_STAGING/WAF_ACL_ARN_PROD repository variable is not set}"
          : "${AWS_REGION:?AWS_REGION repository variable is not set}"
          # The ClusterSecretStore name is defined in the base manifests —
          # read it back out of the render instead of duplicating it here.
          SECRET_STORE_NAME=$(yq eval 'select(.kind == "ClusterSecretStore") | .metadata.name' /tmp/rendered.yaml | head -1)
          : "${SECRET_STORE_NAME:?could not read ClusterSecretStore name from rendered manifests}"
          sed -i \
            -e "s|PLACEHOLDER_ACM_CERT_ARN_[A-Z]*|${ACM_CERT_ARN}|g" \
            -e "s|PLACEHOLDER_WAF_ACL_ARN_[A-Z]*|${WAF_ACL_ARN}|g" \
            -e "s|PLACEHOLDER_NAMESPACE|${NAMESPACE}|g" \
            -e "s|PLACEHOLDER_AWS_REGION|${AWS_REGION}|g" \
            -e "s|PLACEHOLDER_SECRET_STORE_NAME|${SECRET_STORE_NAME}|g" \
            -e "s|ENVIRONMENT_PLACEHOLDER|${ENV_SLUG}|g" \
            /tmp/rendered.yaml
          # Fail fast on ANY residual placeholder — applying a manifest that
          # still says "PLACEHOLDER_" to a live cluster is strictly worse
          # than a failed deploy.
          if grep -n "PLACEHOLDER" /tmp/rendered.yaml; then
            echo "::error::Rendered manifests still contain PLACEHOLDER tokens after substitution — refusing to apply."
            exit 1
          fi

      # infra/k8s/base/migrations/job.yaml documents why this Job must be
      # deleted before every re-apply: Job specs are immutable, and
      # `kubectl apply` on an unchanged one is a no-op — neither works for
      # "run migrations again on this deploy." Extracting just the Job with
      # yq and running it ahead of the full apply also guarantees migrations
      # finish before new backend/frontend pods start taking traffic.
      - name: Run database migrations
        run: |
          NS="${{ inputs.namespace }}"
          yq eval-all 'select(.kind == "Job")' /tmp/rendered.yaml > /tmp/migration-job.yaml
          kubectl delete -f /tmp/migration-job.yaml --ignore-not-found
          kubectl apply -f /tmp/migration-job.yaml
          # Poll BOTH terminal conditions — `kubectl wait --for=condition=
          # complete` alone keeps polling until the full timeout even when
          # the Job has already gone Failed (a Failed Job never becomes
          # Complete), so a broken migration would burn 300s and then report
          # "timed out" instead of "failed".
          complete=""
          failed=""
          for i in $(seq 1 150); do
            complete=$(kubectl get job alembic-migrate -n "$NS" -o jsonpath='{.status.conditions[?(@.type=="Complete")].status}' 2>/dev/null)
            failed=$(kubectl get job alembic-migrate -n "$NS" -o jsonpath='{.status.conditions[?(@.type=="Failed")].status}' 2>/dev/null)
            [ "$complete" = "True" ] && break
            [ "$failed" = "True" ] && break
            sleep 2
          done
          if [ "$complete" != "True" ]; then
            echo "::error::Migration job alembic-migrate failed or did not complete within 300s — pod logs:"
            kubectl describe job alembic-migrate -n "$NS" || true
            kubectl logs -n "$NS" -l job-name=alembic-migrate --all-containers --tail=200 --prefix=true || true
            exit 1
          fi
          kubectl logs -n "$NS" -l job-name=alembic-migrate --all-containers --tail=50 --prefix=true || true
          echo "Migrations completed."

      - name: Apply manifests
        run: kubectl apply -f /tmp/rendered.yaml

      - name: Wait for rollout
        id: rollout
        run: |
          kubectl rollout status deployment/backend -n ${{ inputs.namespace }} --timeout=300s
          kubectl rollout status deployment/frontend -n ${{ inputs.namespace }} --timeout=300s
          kubectl rollout status deployment/keycloak -n ${{ inputs.namespace }} --timeout=300s

      # External check: hits the real ALB/DNS/TLS path, but only the "/"
      # rule (frontend) — infra/k8s/base/ingress/ingress.yaml has no bare
      # /health path rule, only /api (backend), /docs, /redoc, /openapi.json,
      # and / (frontend catch-all), so a public https://<host>/health or
      # /api/health request would not reach either service's actual health
      # route. Internal check: hits each Service's real health route
      # directly over cluster DNS from an ephemeral Job, bypassing that
      # routing gap entirely.
      - name: Smoke test — external (frontend via ALB)
        id: smoke_external
        run: |
          for i in $(seq 1 10); do
            code=$(curl -s -o /dev/null -w "%{http_code}" "https://${{ inputs.app_hostname }}/" || echo "000")
            if [ "$code" = "200" ]; then exit 0; fi
            sleep 10
          done
          echo "::error::Frontend did not return 200 via https://${{ inputs.app_hostname }}/ after 10 attempts"
          exit 1

      - name: Smoke test — internal (backend + frontend health routes)
        id: smoke_internal
        if: success()
        run: |
          NS="${{ inputs.namespace }}"
          JOB="smoke-test-${{ github.run_id }}-${{ github.run_attempt }}"
          # A run-to-completion Job, not `kubectl run` pod: `kubectl wait
          # --for=condition=Ready` never fires on a pod that runs to
          # completion (it transitions straight to Succeeded), and parsing
          # the exit code back out of terminated container state is brittle.
          # Job status conditions carry the result directly.
          kubectl create job "$JOB" -n "$NS" --image=curlimages/curl:8.10.1 \
            --dry-run=client -o yaml \
            -- sh -c "curl -fsS http://backend/health && curl -fsS http://frontend/api/health" \
            | yq eval '.spec.backoffLimit = 1' - \
            | kubectl apply -f -
          complete=""
          failed=""
          for i in $(seq 1 60); do
            complete=$(kubectl get job "$JOB" -n "$NS" -o jsonpath='{.status.conditions[?(@.type=="Complete")].status}' 2>/dev/null)
            failed=$(kubectl get job "$JOB" -n "$NS" -o jsonpath='{.status.conditions[?(@.type=="Failed")].status}' 2>/dev/null)
            [ "$complete" = "True" ] && break
            [ "$failed" = "True" ] && break
            sleep 2
          done
          kubectl logs -n "$NS" -l job-name="$JOB" --all-containers --tail=50 --prefix=true || true
          kubectl delete job "$JOB" -n "$NS" --ignore-not-found
          [ "$complete" = "True" ]

      - name: Roll back on failure
        if: failure() && (steps.rollout.outcome == 'failure' || steps.smoke_external.outcome == 'failure' || steps.smoke_internal.outcome == 'failure')
        run: |
          kubectl rollout undo deployment/backend -n ${{ inputs.namespace }} || true
          kubectl rollout undo deployment/frontend -n ${{ inputs.namespace }} || true
          kubectl rollout undo deployment/keycloak -n ${{ inputs.namespace }} || true
          echo "::error::Deploy to ${{ inputs.environment }} failed and was rolled back to the previous revision."
