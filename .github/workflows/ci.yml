name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  backend:
    runs-on: ubuntu-latest
    # Two separate Postgres containers, not one — the app's DATABASE_URL and
    # MEDICINE_DB_URL point at two logical databases inside ONE RDS instance
    # in production (see infra/terraform/environments/*/main.tf), but
    # backend/tests/conftest.py hardcodes two *different ports* on host
    # "postgres" (5432 / 5433) for its test databases, matching how this
    # repo's tests are actually run locally. Two containers + the hosts-file
    # alias below reproduces that without editing conftest.py.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: medconnect
          POSTGRES_PASSWORD: medconnect
          POSTGRES_DB: medconnect_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U medconnect"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      postgres_medicine:
        image: postgres:16
        env:
          POSTGRES_USER: medconnect
          POSTGRES_PASSWORD: medconnect
          POSTGRES_DB: medicine_db_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U medconnect"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Alias postgres hostname to localhost
        run: echo "127.0.0.1 postgres" | sudo tee -a /etc/hosts

      - name: Install backend dependencies
        working-directory: backend
        run: |
          pip install --no-cache-dir -r requirements.txt
          # Not tracked in requirements.txt (kept free of dev-only tooling) —
          # pinned here instead, since this repo has no requirements-dev.txt.
          pip install ruff==0.8.4 pytest==8.3.4 pytest-asyncio==0.25.0 pytest-cov==6.0.0

      - name: Lint (ruff)
        working-directory: backend
        run: ruff check .

      - name: Verify Alembic migrations apply cleanly
        working-directory: backend
        env:
          DATABASE_URL_SYNC: postgresql://medconnect:medconnect@localhost:5432/medconnect_test
          MEDICINE_DB_URL_SYNC: postgresql://medconnect:medconnect@localhost:5433/medicine_db_test
        run: |
          alembic upgrade head
          alembic -c alembic_medicine.ini upgrade head

      - name: Test (pytest)
        working-directory: backend
        run: pytest -v --cov=app --cov-report=term-missing

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20" # matches frontend/Dockerfile's node:20-alpine
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - working-directory: frontend
        run: npm ci

      - working-directory: frontend
        run: npm run lint

      - working-directory: frontend
        run: npm run test:ci

      - name: Build
        working-directory: frontend
        # Placeholder public values only — next build inlines
        # NEXT_PUBLIC_* vars at build time, but nothing here talks to a real
        # backend or Keycloak; this just proves the production build compiles.
        env:
          NEXT_PUBLIC_API_URL: https://placeholder.invalid/api
          NEXT_PUBLIC_KEYCLOAK_URL: https://placeholder.invalid
          NEXT_PUBLIC_KEYCLOAK_REALM: medconnect
          NEXT_PUBLIC_KEYCLOAK_CLIENT_ID: medconnect-frontend
        run: npm run build

  terraform-fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
      - run: terraform fmt -check -recursive infra/terraform

  terraform-validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        environment: [shared, staging, prod]
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
      - name: terraform init (no backend — syntax/type checking only, no AWS access)
        working-directory: infra/terraform/environments/${{ matrix.environment }}
        run: terraform init -backend=false
      - name: terraform validate
        working-directory: infra/terraform/environments/${{ matrix.environment }}
        run: terraform validate

  kustomize:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        overlay: [staging, prod]
    steps:
      - uses: actions/checkout@v4

      - name: Render overlay
        run: kubectl kustomize infra/k8s/overlays/${{ matrix.overlay }} > /tmp/rendered.yaml

      - name: Install kubeconform
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz | tar xz
          sudo mv kubeconform /usr/local/bin/

      # -ignore-missing-schemas: the ExternalSecret/ClusterSecretStore CRDs
      # (external-secrets.io) have no schema in kubeconform's default
      # catalogue — this checks every core/apps/networking kind strictly and
      # skips only those two kinds rather than failing the whole render.
      # This is the actual schema-sanity check. `kubectl apply --dry-run=client`
      # was tried here too, but even in client-dry-run mode kubectl queries a
      # live API server's discovery endpoint to resolve each kind's
      # RESTMapping — verified locally: it fails outright with no cluster,
      # dummy kubeconfig or not. kubeconform doesn't need a cluster at all.
      - name: Schema check
        run: |
          kubeconform -strict -ignore-missing-schemas \
            -kubernetes-version 1.31.0 \
            -summary \
            /tmp/rendered.yaml
