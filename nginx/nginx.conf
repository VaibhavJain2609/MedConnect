# MedConnect nginx reverse-proxy configuration.
#
# IMPORTANT: this config serves plain HTTP only. TLS is expected to be
# terminated upstream at the ALB/ingress — this config must NOT be the
# public edge without a TLS-terminating layer in front of it.
#
# CSP note: Content-Security-Policy is intentionally NOT set here — the
# single source of truth is next.config.js (frontend) / the FastAPI
# security-headers middleware (API).

events {
    worker_connections 1024;
}

http {
    # Do not emit nginx version in Server header or error pages
    server_tokens off;

    upstream backend {
        server backend:8000;
    }

    upstream frontend {
        server frontend:3000;
    }

    # Rate limiting zones
    # api: general API endpoints — 10 requests/second per IP
    # auth: authentication endpoints — stricter, 10 requests/minute per IP
    limit_req_zone $binary_remote_addr zone=api:10m  rate=10r/s;
    limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 1000;

    access_log /var/log/nginx/access.log;

    server {
        listen 80;
        server_name localhost;

        # Default request body cap; raised to 50M for the uploads endpoint
        # below (medical documents/images).
        client_max_body_size 10M;

        # ---------------------------------------------------------------
        # Security headers applied to all responses served by nginx.
        # CSP is deliberately omitted — next.config.js owns it (single
        # source of truth) so policies cannot drift between layers.
        # Headers here cover any nginx-generated responses (redirects,
        # error pages, etc.) as well as proxied upstream responses.
        # ---------------------------------------------------------------
        add_header X-Content-Type-Options  "nosniff"                          always;
        # SAMEORIGIN (not DENY) so the Next.js app can embed its own iframes
        add_header X-Frame-Options         "SAMEORIGIN"                       always;
        add_header Referrer-Policy         "strict-origin-when-cross-origin"  always;
        add_header Permissions-Policy      "geolocation=(), microphone=(), camera=()" always;

        # Hide upstream technology headers
        proxy_hide_header X-Powered-By;

        # ---------------------------------------------------------------
        # Block API documentation endpoints at the nginx edge.
        # FastAPI already returns 404 for these in production (APP_ENV check),
        # but blocking here adds a defense-in-depth layer and prevents any
        # future misconfiguration from leaking schema information.
        # ---------------------------------------------------------------
        location ~ ^/(docs|redoc|openapi\.json) {
            return 404;
        }

        # Auth endpoints — tight rate limit (10 req/min, burst 5)
        location /api/v1/auth/ {
            limit_req zone=auth burst=5 nodelay;
            proxy_pass http://backend;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # File uploads (medical documents/images) — larger bodies allowed.
        # Longest-prefix match wins over the generic /api/ block.
        location /api/v1/uploads/ {
            client_max_body_size 50M;
            limit_req zone=api burst=20 nodelay;
            proxy_pass http://backend;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 120s;
        }

        # All other API endpoints — 10 req/s, burst 20
        location /api/ {
            limit_req zone=api burst=20 nodelay;
            proxy_pass http://backend;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /health {
            proxy_pass http://backend;
            proxy_set_header Host $host;
        }

        # Frontend — all remaining paths
        location / {
            proxy_pass http://frontend;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}
