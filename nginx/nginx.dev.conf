# Development nginx configuration — permissive settings for local work.
#
# Usage:
#   docker-compose run --rm -v $(pwd)/nginx/nginx.dev.conf:/etc/nginx/nginx.conf:ro nginx
#
# Or temporarily override in docker-compose.yml:
#   volumes:
#     - ./nginx/nginx.dev.conf:/etc/nginx/nginx.conf:ro
#
# DO NOT use this file in staging or production.

events {
    worker_connections 1024;
}

http {
    # Version visible in dev to aid debugging
    server_tokens on;

    upstream backend {
        server backend:8000;
    }

    upstream frontend {
        server frontend:3000;
    }

    # Very permissive rate limits for local development
    limit_req_zone $binary_remote_addr zone=api:10m  rate=100r/s;
    limit_req_zone $binary_remote_addr zone=auth:10m rate=100r/s;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 1000;

    access_log /var/log/nginx/access.log;

    server {
        listen 80;
        server_name localhost;

        client_max_body_size 50M;

        # Relaxed security headers for development
        add_header X-Content-Type-Options  "nosniff"                         always;
        add_header X-Frame-Options         "SAMEORIGIN"                      always;
        add_header Referrer-Policy         "no-referrer-when-downgrade"      always;
        # Permissive CSP — allows inline scripts/styles and eval for Next.js HMR
        add_header Content-Security-Policy "default-src * 'unsafe-inline' 'unsafe-eval' data: blob:;" always;

        proxy_hide_header X-Powered-By;

        # API docs are accessible in development
        location /docs {
            proxy_pass http://backend;
            proxy_set_header Host $host;
        }

        location /redoc {
            proxy_pass http://backend;
            proxy_set_header Host $host;
        }

        location /openapi.json {
            proxy_pass http://backend;
            proxy_set_header Host $host;
        }

        location /api/v1/auth/ {
            limit_req zone=auth burst=100 nodelay;
            proxy_pass http://backend;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/ {
            limit_req zone=api burst=100 nodelay;
            proxy_pass http://backend;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /health {
            proxy_pass http://backend;
            proxy_set_header Host $host;
        }

        location / {
            proxy_pass http://frontend;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}
