# Untracked local-only override: this machine's ports 8080/3000/6379 are held
# by other projects (k3d-prahari-serverlb, travel-redis), so the e2e stack
# runs keycloak on 18080 and the Playwright-run dev server on 3300.
# Usage: docker compose -f docker-compose.yml -f docker-compose.override.yml -f docker-compose.e2e-local.yml up -d keycloak
services:
  keycloak:
    ports: !override
      - "127.0.0.1:18080:8080"
