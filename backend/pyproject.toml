[tool.pytest.ini_options]
# asyncio_mode=auto replaces the deprecated session-scoped `event_loop`
# fixture — pytest-asyncio manages the loop per test automatically.
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
markers = [
    "smoke: fast pre-merge sanity tier — critical-path happy paths + bug regressions (run: pytest -m smoke)",
]

[tool.coverage.run]
source = ["app"]
branch = true
omit = [
    "app/__init__.py",
    "*/alembic/*",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "def __repr__",
    'if __name__ == "__main__":',
]

[tool.coverage.html]
directory = "htmlcov"
