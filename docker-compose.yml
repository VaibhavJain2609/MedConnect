# docker-compose.yml — production-shaped base stack for MedConnect.
#
# For local development, `docker compose` automatically layers
# docker-compose.override.yml on top of this file (dev frontend stage,
# source bind mounts, uvicorn --reload, permissive nginx.dev.conf).
# To run ONLY this base stack:
#   docker compose -f docker-compose.yml up --build
#
# Port-binding policy: every published port is bound to 127.0.0.1 so no
# service is reachable off-host. Real traffic enters through the nginx
# service (or an external LB/ingress in deployed environments).
#
# Image-pinning policy: images are pinned to a specific patch/minor tag
# (never `latest` or a bare major). Bump deliberately after reviewing
# upstream changelogs.

services:
  postgres:
    build:
      context: ./postgres
      dockerfile: Dockerfile
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: medconnect
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER}" ]
      interval: 5s
      timeout: 5s
      retries: 5

  # PgBouncer — transaction-mode connection pooler in front of postgres for
  # production-like parity. The edoburu image generates pgbouncer.ini +
  # userlist.txt at container start from env vars: a DATABASE_URL with no
  # database name produces a wildcard `* = host=postgres port=5432` entry that
  # routes BOTH medconnect and medconnect_medicines through one pooler, and
  # AUTH_TYPE=scram-sha-256 stores the plaintext password in userlist.txt so
  # SCRAM works end-to-end (PG16's default password_encryption).
  # App async URLs point here (:6432); the *_SYNC URLs intentionally bypass
  # it so alembic migrations keep working — see docs/pgbouncer.md.
  pgbouncer:
    image: edoburu/pgbouncer:v1.24.1-p1
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432
      LISTEN_PORT: 6432
      POOL_MODE: transaction
      AUTH_TYPE: scram-sha-256
      ADMIN_USERS: ${POSTGRES_USER}
      DEFAULT_POOL_SIZE: 20
      MAX_CLIENT_CONN: 200
      SERVER_IDLE_TIMEOUT: 600
    ports:
      - "127.0.0.1:6432:6432"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -h 127.0.0.1 -p 6432 -U ${POSTGRES_USER} -d medconnect" ]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.4.6-alpine
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD} --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD} --no-auth-warning ping" ]
      interval: 5s
      timeout: 5s
      retries: 5

  keycloak:
    build:
      context: ./keycloak
      dockerfile: Dockerfile
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/medconnect
      KC_DB_SCHEMA: keycloak
      KC_DB_USERNAME: ${POSTGRES_USER}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD}
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
    command: start-dev --import-realm --health-enabled=true
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      # The upstream Keycloak image deliberately ships no curl/wget, so this
      # uses bash's /dev/tcp to issue a real HTTP HEAD request against the
      # management-port readiness endpoint — not just a TCP connect.
      test: [ "CMD-SHELL", "bash -c '{ printf \"HEAD /health/ready HTTP/1.1\\r\\nconnection: close\\r\\n\\r\\n\" >&0; grep -q \"HTTP/1.1 200\"; } 0<>/dev/tcp/localhost/9000'" ]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 60s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      # Async app traffic goes through PgBouncer (transaction pooling) for
      # production parity; DB_TRANSACTION_POOLING disables asyncpg's prepared
      # statement cache — required in transaction mode.
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@pgbouncer:6432/medconnect
      MEDICINE_DB_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@pgbouncer:6432/medconnect_medicines
      DB_TRANSACTION_POOLING: "true"
      # Sync URLs deliberately bypass PgBouncer — alembic migrations break
      # under transaction pooling (advisory locks span statements). The
      # `alembic upgrade head` calls in `command:` below use these.
      DATABASE_URL_SYNC: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/medconnect
      MEDICINE_DB_URL_SYNC: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/medconnect_medicines
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_PUBLIC_URL: http://localhost:8080
      KEYCLOAK_REALM: medconnect
      KEYCLOAK_CLIENT_ID: medconnect-backend
      APP_ENV: development
      DEBUG: "false"
      # Multi-worker uvicorn — set UVICORN_WORKERS=2 in .env for prod parity.
      # With >1 worker each process exposes its own /metrics.
      UVICORN_WORKERS: ${UVICORN_WORKERS:-1}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:8000/health || exit 1" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    command: >
      sh -c "alembic upgrade head &&
             alembic -c alembic_medicine.ini upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers $${UVICORN_WORKERS:-1}"

  reminder-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: arq app.workers.reminder_worker.WorkerSettings
    environment:
      # Same PgBouncer topology as `backend` — async URLs via :6432 with the
      # prepared-statement cache off; *_SYNC stay direct (see docs/pgbouncer.md).
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@pgbouncer:6432/medconnect
      MEDICINE_DB_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@pgbouncer:6432/medconnect_medicines
      DB_TRANSACTION_POOLING: "true"
      DATABASE_URL_SYNC: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/medconnect
      MEDICINE_DB_URL_SYNC: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/medconnect_medicines
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_REALM: medconnect
      KEYCLOAK_CLIENT_ID: medconnect-backend
      APP_ENV: development
    depends_on:
      postgres:
        condition: service_healthy
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      # `arq --check` reads the worker's health-check sentinel in Redis
      # (written by the running worker) and exits 0 only if it's fresh.
      test: ["CMD-SHELL", "arq --check app.workers.reminder_worker.WorkerSettings"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # NEXT_PUBLIC_* vars are baked into the client bundle at build time
        NEXT_PUBLIC_API_URL: http://localhost:8000
        NEXT_PUBLIC_KEYCLOAK_URL: http://localhost:8080
        NEXT_PUBLIC_KEYCLOAK_REALM: medconnect
        NEXT_PUBLIC_KEYCLOAK_CLIENT_ID: medconnect-frontend
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - backend
    restart: unless-stopped
    healthcheck:
      # manifest.json is a static asset always served by Next.js
      test: [ "CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/manifest.json || exit 1" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  nginx:
    image: nginx:1.28.0-alpine
    ports:
      - "127.0.0.1:80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - frontend
    restart: unless-stopped
    healthcheck:
      # nginx:alpine ships busybox wget, not curl
      test: [ "CMD-SHELL", "nginx -t && wget -q -O /dev/null http://127.0.0.1/health || exit 1" ]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  postgres_data:
  redis_data:
